name: Compiler l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Chut-apk
          path: app/build/outputs/apk/*/release/*.apk

      # Sur la branche principale : publie l'APK avec un lien fixe, téléchargeable depuis le téléphone.
      - name: Publier l'APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/complet/release/app-complet-release.apk Chut.apk
          cp app/build/outputs/apk/lite/release/app-lite-release.apk Chut-lite.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Chut.apk Chut-lite.apk \
            --title "Chut — dernière version" \
            --notes "APK compilés automatiquement depuis le commit ${GITHUB_SHA::7}. Chut.apk = complet ; Chut-lite.apk = sans accès au journal d'appels." \
            --latest
